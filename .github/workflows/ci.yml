name: Clinical Decision Support CI

on: [push, pull_request]

jobs:
  triage-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Clinical Vignettes
        run: |
          python -c "import json; cases=json.load(open('data/clinical_vignettes.json')); assert len(cases)>=3; print('Validated clinical vignettes.')"
      - name: Run Clinical Triage Tests
        run: pytest tests/ -v
      - name: Validate OpenGAP 0.1.0 Manifest
        run: |
          python -c "import yaml; d=yaml.safe_load(open('agent.yaml')); assert d['spec_version']=='0.1.0' and len(d)==5; print('OpenGAP Spec Validated')"
