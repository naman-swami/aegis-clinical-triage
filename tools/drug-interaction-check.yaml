annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Detect contraindications and pharmacokinetic adverse interactions.
input_schema:
  additionalProperties: false
  properties:
    medications:
      type: string
    patient_allergies:
      type: string
  required:
  - medications
  type: object
name: drug-interaction-check
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
